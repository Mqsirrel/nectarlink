# SPDX-License-Identifier: MPL-2.0
# XcodeGen specification for NectarLink iOS.
# Generate the Xcode project with:
#   cd ios && xcodegen generate

name: NectarLink
options:
  bundleIdPrefix: app.nectarlink
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.1.4"
    CURRENT_PROJECT_VERSION: "5"

targets:
  NectarLink:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NectarLink
        excludes:
          - "**/*.modulemap"
          - "**/*.h"
    info:
      path: NectarLink/Info.plist
    entitlements:
      path: NectarLink/NectarLink.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nectarlink.ios
        PRODUCT_NAME: NectarLink
        SWIFT_OBJC_BRIDGING_HEADER: ""
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/NectarLink/Generated"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lc++"
          - "-lsqlite3"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - framework: Frameworks/NectarLinkCore.xcframework
        embed: false
      - target: NectarLinkShareExtension
        embed: true
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CallKit.framework
      - sdk: Contacts.framework
      - sdk: CoreImage.framework
      - sdk: CoreMedia.framework
      - sdk: CoreMotion.framework
      - sdk: CoreVideo.framework
      - sdk: CryptoKit.framework
      - sdk: MediaPlayer.framework
      - sdk: Network.framework
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
      - sdk: ReplayKit.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: UserNotifications.framework
      - sdk: VideoToolbox.framework
      - sdk: Vision.framework
      - sdk: VisionKit.framework
    preBuildScripts:
      - name: Verify NectarLinkCore XCFramework
        basedOnDependencyAnalysis: false
        script: |
          if [ ! -d "${SRCROOT}/Frameworks/NectarLinkCore.xcframework" ]; then
            echo "Building NectarLinkCore.xcframework via scripts/build-rust-xcframework.sh..."
            "${SRCROOT}/scripts/build-rust-xcframework.sh"
          fi

  NectarLinkShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NectarLinkShareExtension
    info:
      path: NectarLinkShareExtension/Info.plist
    entitlements:
      path: NectarLinkShareExtension/NectarLinkShareExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nectarlink.ios.ShareExtension
        PRODUCT_NAME: NectarLinkShareExtension
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - sdk: Social.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: MobileCoreServices.framework
