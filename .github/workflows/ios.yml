name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS App & XCFramework
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain & iOS targets
        run: |
          rustup show active-toolchain || rustup toolchain install stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Rust XCFramework
        run: ./ios/scripts/build-rust-xcframework.sh --release

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate

      - name: Build iOS App (.app)
        run: |
          xcodebuild -project ios/NectarLink.xcodeproj \
            -scheme NectarLink \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Unsigned .ipa for Sideloading
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "NectarLink.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r NectarLink.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NectarLink-iOS-Unsigned-IPA
          path: build/NectarLink.ipa
          retention-days: 14
